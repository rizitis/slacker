<?xml version="1.0" encoding="UTF-8"?>
<!-- slacker-flatpak application icon: the slacker-gui tile with an app grid;
     one tile is lit in the thread's orange and holds the labrys. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffa000"/>
    </linearGradient>
  </defs>

  <!-- tile, as slacker-gui's -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#tile)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="98.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- app grid: three empty tiles in the labyrinth's wall colour -->
  <g fill="none" stroke="#6a6a6a" stroke-width="16" stroke-linejoin="round">
    <rect x="104" y="104" width="128" height="128" rx="30"/>
    <rect x="280" y="104" width="128" height="128" rx="30"/>
    <rect x="104" y="280" width="128" height="128" rx="30"/>
  </g>

  <!-- the lit tile -->
  <rect x="272" y="272" width="144" height="144" rx="34" fill="url(#thread)"/>

  <!-- labrys, as slacker-gui's, on a dark ground so the gold reads -->
  <circle cx="344" cy="344" r="46" fill="#1b1b1b" fill-opacity="0.85"/>
  <g transform="translate(88 96)">
    <rect x="251" y="222" width="10" height="78" rx="5" fill="#ffd700"/>
    <path d="M249 238 L226 226 Q214 248 226 270 L249 258 Z" fill="#ffd700"/>
    <path d="M263 238 L286 226 Q298 248 286 270 L263 258 Z" fill="#dcba00"/>
  </g>
</svg>
