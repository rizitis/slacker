# /etc/sbopkg-ci/sbopkg-ci.conf - configuration for sbopkg-ci (docker edition)
#
# This is a plain bash fragment. In practice the only line you edit per
# docker image is REPO_BRANCH.

# Which SlackBuilds branch this image tracks:
#   current  -> slackware64-current images: Ponce's fork, branch "current"
#               (https://github.com/Ponce/slackbuilds.git - SBo adapted
#               and patched for -current)
#   master   -> SBo git master: approved submissions queued for the next
#               stable (15.0) update
#   15.0     -> Slackware 15.0 stable release branch
REPO_BRANCH=current

# The git URL is derived automatically from REPO_BRANCH (Ponce for
# "current", SlackBuilds.org for everything else). Uncomment to override,
# e.g. to point at your own mirror:
#REPO_GIT_URL=https://github.com/Ponce/slackbuilds.git
#REPO_GIT_BRANCH=current
REPO_ROOT=/var/lib/sbopkg-ci
REPO_NAME=SBo

# Working directories.
SRCDIR=/var/cache/sbopkg-ci      # downloaded source tarballs (cache)
OUTPUT=/tmp                   # where built packages land
TMP=/tmp/SBo                  # SlackBuilds' build scratch space
LOGDIR=/var/log/sbopkg-ci        # permanent build log lives here

# Package tag produced by SlackBuilds (leave as is for SBo).
TAG=_SBo

# What to do when a build fails: continue (default) or stop.
ON_ERROR=continue

# Install dependencies that are not in the SlackBuilds repository from the
# distribution itself, using: slacker install <pkgs> --yes
SLACKER=yes

# Fallback source archive for dead upstream download links.
SRCARCH_URL=https://slackware.uk/sbosrcarch

# Extra wget flags for source downloads.
WGETFLAGS="--continue --timeout=30 --tries=2 --no-verbose"

# Per-package pre/post hooks: /etc/sbopkg-ci/hooks.d/<name>.pre runs before
# the build, <name>.post after a successful install. Use them for groups,
# users, directories, permissions - anything a package needs prepared.
HOOKS_DIR=/etc/sbopkg-ci/hooks.d

# Automatically run the groupadd/useradd commands listed in a package's
# README (the standard SBo convention) when the user/group is missing.
AUTO_USERS=yes
