[package]
name = "slacker-gui"
version = "4.0.0"
edition = "2021"
rust-version = "1.83"
description = "GTK4/libadwaita front-end for the slacker package manager"
license = "Apache-2.0"
authors = ["rizitis"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_4"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

[profile.release]
opt-level = 2
lto = true
strip = true
