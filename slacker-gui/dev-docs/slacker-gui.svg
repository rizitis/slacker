<?xml version="1.0" encoding="UTF-8"?>
<!-- slacker-gui application icon: a Cretan labyrinth, Ariadne's thread
     entering from below and winding to the labrys at the centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffa000"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#tile)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="98.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- walls: outer ring open top and bottom, middle ring open at the
       bottom, inner ring open at the top -->
  <g fill="none" stroke="#6a6a6a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 88 H104 V424 H232"/>
    <path d="M280 88 H408 V424 H280"/>
    <path d="M232 368 H160 V144 H352 V368 H280"/>
    <path d="M232 200 H216 V312 H296 V200 H280"/>
  </g>

  <!-- Ariadne's thread -->
  <path d="M256 470 V340 H188 V172 H256 V214"
        fill="none" stroke="url(#thread)" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- labrys -->
  <g>
    <rect x="251" y="222" width="10" height="78" rx="5" fill="#ffd700"/>
    <path d="M249 238 L226 226 Q214 248 226 270 L249 258 Z" fill="#ffd700"/>
    <path d="M263 238 L286 226 Q298 248 286 270 L263 258 Z" fill="#dcba00"/>
  </g>
</svg>
